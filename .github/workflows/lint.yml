# ===============================================================
# 🔍  Lint & Static Analysis - Code Quality Gate
# ===============================================================
#
#   - runs each linter in its own matrix job for visibility
#   - mirrors the actual CLI commands used locally (no `make`)
#   - ensures fast-failure isolation: one failure doesn't hide others
#   - each job installs the project in dev-editable mode
#   - logs are grouped and plain-text for readability
# ---------------------------------------------------------------

name: Lint & Static Analysis

on:
  pull_request:
    branches: ["master", "main"]

permissions:
  contents: read

jobs:
  lint:
    strategy:
      fail-fast: false
      matrix:
        include:
          # -------------------------------------------------------
          # 🧼 Syntax & Format Checkers
          # -------------------------------------------------------
          - id: yamllint
            setup: pip install yamllint
            cmd: yamllint -c .yamllint .

          - id: jsonlint
            setup: |
              sudo apt-get update -qq
              sudo apt-get install -y jq
            cmd: |
              find . -type f -name '*.json' -not -path './node_modules/*' -print0 |
                xargs -0 -I{} jq empty "{}"

          - id: tomllint
            setup: pip install tomlcheck
            cmd: |
              find . -type f -name '*.toml' -print0 |
                xargs -0 -I{} tomlcheck "{}"

          # -------------------------------------------------------
          # 🐍 Python Linters & Type Checkers
          # -------------------------------------------------------
          - id: ruff
            setup: echo "Using poetry-installed ruff"
            cmd: |
              poetry run ruff check src/ tests/

          - id: black
            setup: echo "Using poetry-installed black"
            cmd: |
              poetry run black --check --diff src/ tests/

          - id: isort
            setup: echo "Using poetry-installed isort"
            cmd: |
              poetry run isort --check-only --diff src/ tests/

          - id: flake8
            setup: pip install flake8
            cmd: flake8 src/ tests/ --max-line-length=88 --extend-ignore=E203,W503,E501

          - id: unimport
            setup: pip install unimport
            cmd: |
              unimport src/ tests/

          - id: vulture
            setup: pip install vulture
            cmd: |
              vulture src/ tests/ --min-confidence 80 --exclude="*git_client.py"

          # -------------------------------------------------------
          # 🔒 Security & Packaging Checks
          # -------------------------------------------------------
          - id: bandit
            setup: echo "Using poetry-installed bandit"
            cmd: poetry run bandit -r src/ --skip B101,B104,B105,B311,B601 -x src/mcp_shared_lib/test_utils/ -ll

          - id: safety
            setup: echo "Using poetry-installed safety"
            cmd: poetry run safety check --json

    name: ${{ matrix.id }}
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------
      # 0️⃣  Checkout
      # -----------------------------------------------------------
      - name: ⬇️  Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Git
        run: |
          sudo apt-get update
          sudo apt-get install -y git

      # -----------------------------------------------------------
      # 1️⃣  Python Setup
      # -----------------------------------------------------------
      - name: 🐍  Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # -----------------------------------------------------------
      # 2️⃣  Install Poetry
      # -----------------------------------------------------------
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: '1.7.1'
          virtualenvs-create: true
          virtualenvs-in-project: true

      # -----------------------------------------------------------
      # 3️⃣  Install Project + Dev Dependencies
      # -----------------------------------------------------------
      - name: 📦  Install project and dependencies
        run: |
          poetry install --no-interaction --with dev,test

      # -----------------------------------------------------------
      # 3️⃣  Install Tool-Specific Requirements
      # -----------------------------------------------------------
      - name: 🔧  Install tool - ${{ matrix.id }}
        run: ${{ matrix.setup }}

      # -----------------------------------------------------------
      # 4️⃣  Run Linter / Validator
      # -----------------------------------------------------------
      - name: 🔍  Run ${{ matrix.id }}
        run: ${{ matrix.cmd }}
